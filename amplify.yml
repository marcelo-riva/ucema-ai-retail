version: 1
env:
  variables:
    NEXT_PUBLIC_APP_ENV: amplify
    NEXT_PUBLIC_DATA_MODE: amplify
    NEXT_PUBLIC_AWS_REGION: us-west-2
    NEXT_PUBLIC_LAB_VERSION: v3
applications:
  - appRoot: laboratorio_v3/apps/web
    backend:
      phases:
        build:
          commands:
            - npm ci
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
