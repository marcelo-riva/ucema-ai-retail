<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus · Panorámica del negocio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f3; --surface:#fff; --surface-muted:#edf2ee; --line:#d9e0da;
  --ink:#17211b; --muted:#657269; --brand:#0f6b5d; --brand-strong:#08483f;
  --accent:#bf6f28; --danger:#b42318; --success:#19735a; --warning:#a15c07;
  --shadow:0 12px 28px rgba(23,33,27,.08);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
.frame{height:100vh;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;
  padding:clamp(14px,2.2vh,26px) clamp(16px,2.4vw,34px) clamp(12px,1.8vh,22px)}

header{display:flex;align-items:center;justify-content:space-between;gap:24px;
  border-bottom:1px solid var(--line);padding-bottom:12px}
.brandwrap{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);
  font-size:clamp(13px,1.15vw,17px)}
.brandsub{font-family:var(--mono);font-size:clamp(9px,.68vw,11.5px);color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;gap:6px;flex:none}
nav button{font-family:var(--sans);font-size:clamp(11px,.78vw,13px);font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);
  padding:7px 14px;cursor:pointer;border-radius:999px;transition:.15s;white-space:nowrap}
nav button:hover{color:var(--ink);border-color:var(--brand)}
nav button[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
nav button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

main{flex:1;min-height:0;position:relative;margin-top:clamp(10px,1.6vh,18px)}
.panel{position:absolute;inset:0;display:none;flex-direction:column}
.panel.on{display:flex;animation:rise .4s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel.on{animation:none}}

.plateno{font-family:var(--mono);font-size:clamp(9px,.7vw,11.5px);color:var(--brand);
  font-weight:600;letter-spacing:.14em;margin-bottom:4px}
h1{font-weight:800;font-size:clamp(22px,2.5vw,36px);margin:0;line-height:1.05;letter-spacing:-.01em}
.lede{font-size:clamp(12px,.92vw,15px);color:var(--muted);max-width:70ch;margin:6px 0 0;line-height:1.5}

.stage{flex:1;min-height:0;display:flex;gap:clamp(16px,1.8vw,28px);margin-top:clamp(10px,1.6vh,18px)}
.canvas{flex:1;min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);padding:clamp(12px,1.6vh,20px)}
svg{width:100%;height:100%;display:block;overflow:visible}

.side{width:clamp(190px,17vw,260px);flex:none;display:flex;flex-direction:column;
  justify-content:center;gap:clamp(10px,1.6vh,18px)}
.read{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:clamp(10px,1.4vh,16px) clamp(12px,1vw,18px)}
.read .k{font-size:clamp(9px,.66vw,11px);font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.read .v{font-weight:800;font-size:clamp(22px,2.1vw,34px);line-height:1;letter-spacing:-.02em}
.read .v small{font-family:var(--mono);font-size:.34em;font-weight:500;letter-spacing:.06em;
  color:var(--muted);margin-left:6px;vertical-align:.3em}
.read .note{font-size:clamp(10px,.72vw,12.5px);color:var(--muted);margin:6px 0 0;line-height:1.45}
.v.brand{color:var(--brand)} .v.accent{color:var(--accent)} .v.danger{color:var(--danger)}

footer{border-top:1px solid var(--line);margin-top:clamp(10px,1.4vh,16px);padding-top:10px;
  display:flex;justify-content:space-between;align-items:baseline;gap:24px}
.blind{font-size:clamp(10px,.76vw,13px);color:var(--muted);line-height:1.4}
.blind b{color:var(--accent);font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  font-size:.86em;margin-right:8px}
.src{font-family:var(--mono);font-size:clamp(8px,.62vw,10.5px);color:#9aa69d;
  letter-spacing:.05em;white-space:nowrap}

text{font-family:var(--sans);fill:var(--muted);font-size:13px}
.tick{font-size:12px;fill:#8a968c}
.axis{stroke:var(--line);stroke-width:1.2}
.grid{stroke:#e9eeea;stroke-width:1}
.lbl{font-size:14px;font-weight:700;fill:var(--ink)}
.lbl-sm{font-size:11.5px;fill:var(--muted)}
.legend{font-size:12.5px;font-weight:600}
.val{font-size:13px;font-weight:700;fill:var(--ink)}
</style>
</head>
<body>
<div class="frame">
<header>
  <div class="brandwrap">
    <span class="brand">Nexus</span>
    <span class="brandsub">Panorámica para el Comité · 12 meses de historia + 12 de proyección</span>
  </div>
  <nav id="nav" aria-label="Paneles"></nav>
</header>
<main id="main"></main>
</div>
<script>
const D = {
  months: ["2025-08","2025-09","2025-10","2025-11","2025-12","2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09","2026-10","2026-11","2026-12","2027-01","2027-02","2027-03","2027-04","2027-05","2027-06","2027-07"],
  ingresos: [884.7, 863.1, 875.3, 882.5, 959.1, 918.1, 900.2, 888.8, 886.6, 877.1, 905.7, 925.5, 900.4, 879, 876.3, 892.6, 984.2, 920, 925.8, 897.5, 896.4, 911.9, 918, 934.4],
  cmv: [650.6, 625.5, 622.9, 620, 661.7, 638.1, 628.9, 631.6, 640.5, 640, 667.8, 685.7, 660.2, 637.6, 625.2, 627.7, 677.7, 642.3, 646, 637.9, 643.7, 666.1, 678.2, 690.2],
  opex: [210.9, 211.6, 212.4, 213.3, 214.7, 215.2, 215.9, 216.6, 217.4, 218.2, 219.2, 220.2, 220.8, 221.5, 222.3, 223.3, 224.9, 225.2, 226.1, 226.8, 227.6, 228.6, 229.5, 230.5],
  ebitda: [23.2, 26.1, 39.9, 49.2, 82.7, 64.8, 55.3, 40.7, 28.7, 18.9, 18.7, 19.6, 19.3, 19.8, 28.7, 41.6, 81.6, 52.4, 53.6, 32.8, 25.1, 17.2, 10.4, 13.7],
  caja: [428.2, 443.3, 415.3, 412.8, 444.9, 493.4, 506.5, 499.5, 461, 406.4, 372.1, 380, 412.6, 422.5, 380.3, 368.3, 390.6, 435, 446.2, 423.6, 377.4, 319, 292.7, 269.3],
  subgrupos: [
    {sub:"ETI_CRONICOS", fam:"ETICOS", skus:38, fact:2256, mg:19.5, stock:394, dias:79},
    {sub:"DERMOCOSMETICA", fam:"SELECTIVOS", skus:46, fact:2239, mg:44.1, stock:246, dias:72},
    {sub:"ETI_AGUDOS", fam:"ETICOS", skus:34, fact:1761, mg:18.5, stock:299, dias:76},
    {sub:"CUIDADO_PERSONAL", fam:"MASIVOS", skus:48, fact:1263, mg:29.1, stock:197, dias:80},
    {sub:"OTC_VENTA_LIBRE", fam:"MASIVOS", skus:42, fact:959, mg:18.7, stock:190, dias:89},
    {sub:"HOGAR", fam:"MASIVOS", skus:32, fact:777, mg:26.6, stock:79, dias:50},
    {sub:"INFANTIL", fam:"MASIVOS", skus:30, fact:768, mg:28.1, stock:128, dias:85},
    {sub:"MAQUILLAJE", fam:"SELECTIVOS", skus:30, fact:743, mg:44.4, stock:104, dias:91}
  ],
  segmentos: [
    {seg:"VIP", n:44, fact:4897},
    {seg:"RIESGO DE FUGA", n:42, fact:3112},
    {seg:"OPORTUNISTAS", n:68, fact:2252},
    {seg:"BAJA PRIORIDAD", n:46, fact:506}
  ]
};


const NS="http://www.w3.org/2000/svg";
const el=(t,a={})=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
const txt=(s,x,y,a={})=>{const n=el("text",Object.assign({x,y},a));n.textContent=s;return n;};
const fmt=n=>n.toLocaleString("es-AR");

/* ═════ 01 · la tijera ═════ */
function plate1(W,H){
  const L=62,R=18,T=26,B=34;
  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});
  const hTop=Math.round((H-T-B)*0.60), gap=Math.round((H-T-B)*0.10);
  const yTop2=T+hTop+gap, hBot=H-B-yTop2;
  const n=D.months.length, iw=W-L-R, x=i=>L+(i+.5)*(iw/n);
  const lo=805, hi=1010, yT=v=>T+hTop-((v-lo)/(hi-lo))*hTop;
  [850,900,950,1000].forEach(v=>{
    s.appendChild(el("line",{x1:L,x2:W-R,y1:yT(v),y2:yT(v),class:"grid"}));
    s.appendChild(txt(v,L-10,yT(v)+4,{"text-anchor":"end",class:"tick"}));
  });
  const dv=x(11)+(iw/n)/2;
  s.appendChild(el("rect",{x:dv,y:T-10,width:W-R-dv,height:H-B-T+10,fill:"#0f6b5d",opacity:".035"}));
  s.appendChild(el("line",{x1:dv,x2:dv,y1:T-10,y2:H-B,stroke:"#0f6b5d","stroke-width":1.2,
    "stroke-dasharray":"4 4",opacity:".5"}));
  s.appendChild(txt("HISTORIA",dv-10,T-12,{"text-anchor":"end",class:"tick"}));
  s.appendChild(txt("FORECAST SIN CAMBIOS DE GESTIÓN",dv+10,T-12,{class:"tick",fill:"#0f6b5d"}));
  const path=(a,f)=>a.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${f(v).toFixed(1)}`).join(" ");
  const ct=D.cmv.map((c,i)=>c+D.opex[i]);
  s.appendChild(el("path",{d:path(D.ingresos,yT)+" "+ct.map((v,i)=>`L${x(n-1-i).toFixed(1)},${yT(ct[n-1-i]).toFixed(1)}`).join(" ")+" Z",
    fill:"#0f6b5d",opacity:".10"}));
  s.appendChild(el("path",{d:path(D.ingresos,yT),fill:"none",stroke:"#0f6b5d","stroke-width":2.6}));
  s.appendChild(el("path",{d:path(ct,yT),fill:"none",stroke:"#bf6f28","stroke-width":2.6}));
  s.appendChild(txt("Ingresos por ventas",x(0),yT(D.ingresos[0])-14,{class:"legend",fill:"#0f6b5d"}));
  s.appendChild(txt("Costo de mercadería + gastos operativos",x(0),yT(ct[0])+26,{class:"legend",fill:"#bf6f28"}));
  s.appendChild(txt("ARS millones por mes · eje cortado en 805",L,T-12,{class:"tick"}));
  const maxE=90, yB=v=>yTop2+hBot-(v/maxE)*hBot;
  s.appendChild(el("line",{x1:L,x2:W-R,y1:yB(0),y2:yB(0),class:"axis"}));
  s.appendChild(txt("EBITDA mensual · ARS millones",L,yTop2-8,{class:"legend",fill:"#657269"}));
  const bw=(iw/n)*.6;
  D.ebitda.forEach((v,i)=>s.appendChild(el("rect",{x:x(i)-bw/2,y:yB(v),width:bw,
    height:Math.max((v/maxE)*hBot,1.5),rx:2,fill:i<12?"#0f6b5d":"#7fb2a6"})));
  D.months.forEach((m,i)=>{if(i%3===0)s.appendChild(txt(m.slice(2).replace("-","/"),x(i),H-B+20,
    {"text-anchor":"middle",class:"tick"}));});
  return s;
}

/* ═════ 02 · las ocho categorías ═════ */
function plate2(W,H){
  const L=64,R=150,T=34,B=50;
  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});
  const iw=W-L-R, ih=H-T-B;
  const x=v=>L+(v/2400)*iw, y=v=>T+ih-((v-14)/34)*ih;
  [0,600,1200,1800,2400].forEach(v=>{
    s.appendChild(el("line",{x1:x(v),x2:x(v),y1:T,y2:T+ih,class:"grid"}));
    s.appendChild(txt(fmt(v),x(v),T+ih+22,{"text-anchor":"middle",class:"tick"}));});
  [20,30,40,48].forEach(v=>{
    s.appendChild(el("line",{x1:L,x2:L+iw,y1:y(v),y2:y(v),class:"grid"}));
    s.appendChild(txt(v+"%",L-10,y(v)+4,{"text-anchor":"end",class:"tick"}));});
  s.appendChild(txt("Facturación anual · ARS millones",L+iw/2,H-14,{"text-anchor":"middle",class:"legend"}));
  s.appendChild(txt("Margen bruto",L-10,T-14,{"text-anchor":"end",class:"legend"}));
  const col={ETICOS:"#0f6b5d",MASIVOS:"#bf6f28",SELECTIVOS:"#4a7fa5"};
  const place={ETI_CRONICOS:"l",DERMOCOSMETICA:"l",ETI_AGUDOS:"b",CUIDADO_PERSONAL:"r",
               OTC_VENTA_LIBRE:"r",HOGAR:"b",INFANTIL:"r",MAQUILLAJE:"r"};
  D.subgrupos.forEach(d=>{
    const r=9+Math.sqrt(d.skus)*2.3, cx=x(d.fact), cy=y(d.mg), p=place[d.sub];
    s.appendChild(el("circle",{cx,cy,r,fill:col[d.fam],opacity:".18"}));
    s.appendChild(el("circle",{cx,cy,r,fill:"none",stroke:col[d.fam],"stroke-width":2}));
    let tx=cx,ty=cy-2,an="middle";
    if(p==="r"){tx=cx+r+11;an="start";} if(p==="l"){tx=cx-r-11;an="end";} if(p==="b"){ty=cy+r+22;}
    s.appendChild(txt(d.sub.replace(/_/g," "),tx,ty,{"text-anchor":an,class:"lbl"}));
    s.appendChild(txt(d.skus+" SKUs",tx,ty+16,{"text-anchor":an,class:"lbl-sm"}));
  });
  let ly=T+4;
  Object.keys(col).forEach(k=>{
    s.appendChild(el("circle",{cx:W-R+30,cy:ly,r:6,fill:col[k]}));
    s.appendChild(txt(k,W-R+44,ly+5,{class:"legend",fill:"#657269"})); ly+=24;});
  s.appendChild(txt("el área del círculo",W-R+18,ly+16,{class:"tick"}));
  s.appendChild(txt("es la cantidad de SKUs",W-R+18,ly+32,{class:"tick"}));
  return s;
}

/* ═════ 03 · el capital dormido ═════ */
function plate3(W,H){
  const L=170,R=170,T=34,B=46;
  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});
  const iw=W-L-R, ih=H-T-B, rows=[...D.subgrupos].sort((a,b)=>b.dias-a.dias);
  const bh=ih/rows.length, x=v=>L+(v/100)*iw;
  [0,25,50,75,100].forEach(v=>{
    s.appendChild(el("line",{x1:x(v),x2:x(v),y1:T,y2:T+ih,class:"grid"}));
    s.appendChild(txt(v,x(v),T+ih+22,{"text-anchor":"middle",class:"tick"}));});
  s.appendChild(txt("Días de cobertura",L+iw/2,H-12,{"text-anchor":"middle",class:"legend"}));
  const h=Math.min(bh*.55,26);
  rows.forEach((d,i)=>{
    const cy=T+i*bh+bh/2;
    s.appendChild(txt(d.sub.replace(/_/g," "),L-14,cy+5,{"text-anchor":"end",class:"lbl"}));
    s.appendChild(el("rect",{x:L,y:cy-h/2,width:x(d.dias)-L,height:h,rx:3,
      fill:d.dias>76?"#0f6b5d":"#7fb2a6",opacity:d.dias>76?".85":".6"}));
    s.appendChild(txt(d.dias+" d",x(d.dias)+10,cy+5,{class:"val"}));
    s.appendChild(txt("ARS "+fmt(d.stock)+" M",x(d.dias)+58,cy+5,{class:"lbl-sm"}));
  });
  s.appendChild(el("line",{x1:x(76),x2:x(76),y1:T-8,y2:T+ih+6,stroke:"#bf6f28","stroke-width":1.8,"stroke-dasharray":"6 4"}));
  s.appendChild(txt("Promedio de la cadena · 76 días",x(76)+10,T-14,{class:"legend",fill:"#bf6f28"}));
  return s;
}

/* ═════ 04 · quiénes compran ═════ */
function plate4(W,H){
  const T=54,B=44, s=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});
  const mid=W*0.40, gap=220, ih=H-T-B, rows=D.segmentos, bh=ih/rows.length;
  const maxN=70, maxF=5000, half=mid-gap/2-40, rw=W-(mid+gap/2)-70;
  s.appendChild(txt("Clientes del panel",mid-gap/2-10,T-18,{"text-anchor":"end",class:"legend",fill:"#4a7fa5"}));
  s.appendChild(txt("Facturación anual · ARS millones",mid+gap/2+10,T-18,{class:"legend",fill:"#bf6f28"}));
  const h=Math.min(bh*.5,34);
  rows.forEach((d,i)=>{
    const cy=T+i*bh+bh/2, wl=(d.n/maxN)*half, wr=(d.fact/maxF)*rw;
    s.appendChild(el("rect",{x:mid-gap/2-wl,y:cy-h/2,width:wl,height:h,rx:3,fill:"#4a7fa5",opacity:".55"}));
    s.appendChild(el("rect",{x:mid+gap/2,y:cy-h/2,width:wr,height:h,rx:3,fill:"#bf6f28",opacity:".55"}));
    s.appendChild(txt(d.seg,mid,cy+5,{"text-anchor":"middle",class:"lbl"}));
    s.appendChild(txt(d.n,mid-gap/2-wl-12,cy+5,{"text-anchor":"end",class:"val"}));
    s.appendChild(txt(fmt(d.fact),mid+gap/2+wr+12,cy+5,{class:"val"}));
  });
  s.appendChild(el("line",{x1:mid-gap/2,x2:mid-gap/2,y1:T-8,y2:H-B,class:"axis"}));
  s.appendChild(el("line",{x1:mid+gap/2,x2:mid+gap/2,y1:T-8,y2:H-B,class:"axis"}));
  s.appendChild(txt("El panel es una muestra de 200 clientes sobre una base de ~40.000. La facturación está extrapolada a la base completa.",
    W/2,H-10,{"text-anchor":"middle",class:"tick"}));
  return s;
}

const PANELS=[
 {tab:"01 · Resultado",no:"LÁMINA 01 / 04",h:"El margen que se angosta",
  lede:"Ingresos y costos mes a mes. La franja entre las dos líneas es el margen operativo: la facturación crece, la estructura de costos crece más rápido.",
  chart:plate1,
  reads:[{k:"EBITDA últimos 12 meses",v:"468",cls:"brand",u:"ARS M",note:"4,3% sobre ventas"},
         {k:"EBITDA próximos 12 meses",v:"396",cls:"danger",u:"ARS M",note:"3,6% sobre ventas. La facturación crece 1,6%; los costos crecen más rápido."},
         {k:"Caja al mes 12",v:"269",cls:"accent",u:"ARS M",note:"Arranca en 380."}],
  blind:"No muestra qué producto, qué precio ni qué cliente hay detrás de cada peso."},
 {tab:"02 · Categorías",no:"LÁMINA 02 / 04",h:"Las ocho categorías",
  lede:"Cuánto factura y cuánto margen deja cada subgrupo del surtido. Trescientos SKUs agrupados en ocho.",
  chart:plate2,
  reads:[{k:"Facturación anual",v:"10.900",cls:"",u:"ARS M",note:"300 SKUs activos"},
         {k:"Margen bruto promedio",v:"28,4",cls:"brand",u:"%",note:"Entre 18,5% y 44,4% según la categoría."},
         {k:"Amplitud entre categorías",v:"2,4×",cls:"accent",u:"",note:"La más rentable deja 44,4% de margen; la menos rentable, 18,5%."}],
  blind:"No muestra qué SKU sostiene cada categoría, ni quién la compra."},
 {tab:"03 · Inventario",no:"LÁMINA 03 / 04",h:"El capital dormido",
  lede:"Días de cobertura por categoría, medidos contra la demanda promedio del último año.",
  chart:plate3,
  reads:[{k:"Inventario valorizado",v:"1.637",cls:"accent",u:"ARS M"},
         {k:"Cobertura promedio",v:"76",cls:"",u:"días"},
         {k:"Inversión a financiar",v:"600",cls:"danger",u:"ARS M",note:"Cuatro locales nuevos aprobados por el Directorio, sin tomar deuda."}],
  blind:"No muestra en qué mes se vende cada cosa. La cobertura está medida contra un promedio."},
 {tab:"04 · Clientes",no:"LÁMINA 04 / 04",h:"Quiénes compran",
  lede:"Los cuatro segmentos del modelo RFM vigente: cuántos clientes tiene cada uno y cuánto factura.",
  chart:plate4,
  reads:[{k:"Base identificada",v:"~40.000",cls:"",u:"clientes",note:"Programa de fidelidad."},
         {k:"Presupuesto de campañas",v:"45",cls:"accent",u:"ARS M",note:"Incremental sobre el marketing ya incluido en el baseline. Máximo 2 campañas simultáneas."},
         {k:"Segmento VIP",v:"≥ 100",cls:"brand",u:"índice",note:"Su facturación no puede caer respecto de la actual. Es una de las cuatro metas del Comité."}],
  blind:"No muestra qué compra cada segmento, ni desde cuándo, ni con qué frecuencia."}
];

const main=document.getElementById("main"), nav=document.getElementById("nav");
PANELS.forEach((p,i)=>{
  const sec=document.createElement("section");
  sec.className="panel"; sec.id="p"+i;
  sec.innerHTML=`<div class="plateno">${p.no}</div><h1>${p.h}</h1><p class="lede">${p.lede}</p>
    <div class="stage"><div class="canvas"></div>
      <aside class="side">${p.reads.map(r=>`<div class="read"><span class="k">${r.k}</span>
        <span class="v ${r.cls}">${r.v}${r.u?`<small>${r.u}</small>`:""}</span>
        ${r.note?`<p class="note">${r.note}</p>`:""}</div>`).join("")}</aside></div>
    <footer><span class="blind"><b>Lo que esta lámina no dice</b>${p.blind}</span>
      <span class="src">NEXUS_CASO_INTEGRADOR.xlsx</span></footer>`;
  main.appendChild(sec);
  const b=document.createElement("button");
  b.textContent=p.tab; b.onclick=()=>show(i); nav.appendChild(b);
});

let cur=-1;
function draw(i){
  const c=document.querySelectorAll(".canvas")[i];
  const w=Math.max(c.clientWidth-2,320), h=Math.max(c.clientHeight-2,220);
  c.innerHTML=""; c.appendChild(PANELS[i].chart(Math.round(w),Math.round(h)));
}
function show(i){
  cur=i;
  document.querySelectorAll(".panel").forEach((s,j)=>s.classList.toggle("on",j===i));
  [...nav.children].forEach((b,j)=>b.setAttribute("aria-current",j===i));
  requestAnimationFrame(()=>draw(i));
}
show(0);
addEventListener("resize",()=>{if(cur>=0)draw(cur);});
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" ")show(Math.min(cur+1,PANELS.length-1));
  if(e.key==="ArrowLeft")show(Math.max(cur-1,0));
  if(/^[1-4]$/.test(e.key))show(+e.key-1);
});
</script>
</body>
</html>
